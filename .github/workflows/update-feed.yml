name: Update TED video RSS feed

on:
  schedule:
    # Runs every 6 hours. Edit this cron if you want it more/less frequent.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate feed.xml
        run: python ted_rss_scraper.py --out docs/feed.xml --max-items 40 --pages 3

      - name: Commit and push if changed
        run: |
          git config user.name "ted-rss-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/feed.xml
          git diff --cached --quiet && echo "No changes" || git commit -m "Update TED video feed"
          git push
